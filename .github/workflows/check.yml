# Type-check and build the site, so a broken build never reaches main.
name: check

# Cheap, so it runs on every push (Run workflow re-runs it by hand).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node tools/check-dist.mjs
