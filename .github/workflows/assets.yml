# Rebuild the site's sounds, listen sheets and demo data with the pinned SEGAN release and fail if the
# committed output differs, so the site can never play or show anything SEGAN doesn't produce.
name: assets

# Slow, so it runs on the PR once it leaves draft (PRs stay drafts while in development and review), and again
# only if a commit lands after that: the last gate before merge. Run workflow re-runs it by hand.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: SEGAN's CHANGELOG.md at the pinned tag
        run: |
          tag=v$(sed -n 's/^segan-gen==\([0-9.]*\)$/\1/p' requirements.txt)
          mkdir segan-src
          curl -fsSL "https://raw.githubusercontent.com/lukasgolino/segan/$tag/CHANGELOG.md" -o segan-src/CHANGELOG.md
      - run: python tools/build_site_assets.py --check --segan-repo segan-src
