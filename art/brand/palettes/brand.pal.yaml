  "1": { hex: "#171a2b", name: night }
  "2": { hex: "#2a2f4a", name: dusk }
  "3": { hex: "#3b2a7a", name: violet_deep }
  "4": { hex: "#6d4bd1", name: violet }
  "5": { hex: "#8b5cf6", name: violet_light }
  "6": { hex: "#6b9dff", name: wave }
  "7": { hex: "#a5d8ff", name: ice }
  "8": { hex: "#1e3a7a", name: blue_deep }
  "9": { hex: "#3e6fd8", name: blue }
