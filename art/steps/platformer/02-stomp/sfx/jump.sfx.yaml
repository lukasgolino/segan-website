name: jump
description: "Springy platformer jump: a thin square sweeping up C4 -> G5 in 0.14 s, with a tiny airy lift on top."
preset: jump             # starting point; `segan bake sfx jump --in-place` writes out every field to tune
category: sfx
status: draft
style_version: 1
tags: [player, movement]
layers:
  - { id: tone, pitch: [[0, C4], [0.14, G5]] }
  - id: lift                  # a breath of noise so the take-off has an edge
    osc: noise
    filter: { type: hp, cutoff: 5000 }
    env: [0.001, 0.04, 0.0, 0.03]
    gain: -22
